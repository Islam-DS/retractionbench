# Retraction Watch reason vocabulary -- heuristic candidate screen.
#
# THIS IS NOT GROUND TRUTH. screen_class is a coarse pre-filter for
# candidate selection, nothing more. The reason tag on a Retraction Watch
# record tells us where to look; it does not tell us whether the paper's
# claim was actually invalidated. That determination is made by a human
# annotator reading the retraction notice text (see docs/ANNOTATION.md).
#
# Four classes:
#   claim_invalidating   -- the finding's own evidentiary basis is implicated
#   process_only         -- misconduct/procedure that doesn't itself impugn the finding
#   procedural_metadata  -- describes the notice or investigation process, not the
#                           paper; IGNORED entirely by tier classification
#   ambiguous            -- genuinely characterises the paper but the implication
#                           for the claim is unresolved from the tag alone
#
# Every assignment here is a judgment call, expected to be revised. Revisions
# must bump schema_version below. Full rationale, including the exclusion
# counts that drove the procedural_metadata split, is in docs/DECISIONS.md.

schema_version: "0.1.0"

